<!DOCTYPE html>
<html lang="en" data-theme="white">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Loadwise — My Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
/* ============ DESIGN TOKENS ============ */
:root, [data-theme="white"]{
  --bg-primary:#F7F8FA; --bg-secondary:#FFFFFF; --bg-tertiary:#EFF1F5;
  --surface:#FFFFFF; --surface-hover:#F4F5F8;
  --text-primary:#14181F; --text-secondary:#5B6472; --text-muted:#98A2B3;
  --border:#E4E7EC;
  --accent:#4F46E5; --accent-hover:#4338CA; --accent-soft:#EEF0FE;
  --success:#12B76A; --success-soft:#ECFDF3;
  --warning:#F79009; --warning-soft:#FFFAEB;
  --danger:#F04438; --danger-soft:#FEF3F2;
  --info:#0BA5EC; --info-soft:#F0F9FF;
  --shadow: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
}
[data-theme="twilight"]{
  --bg-primary:#1C1013; --bg-secondary:#26151A; --bg-tertiary:#301A1E;
  --surface:#281620; --surface-hover:#371E24;
  --text-primary:#FBEADE; --text-secondary:#E1AE93; --text-muted:#A5776A;
  --border:#492A2E;
  --accent:#F97316; --accent-hover:#FB8B3C; --accent-soft:#3E1F14;
  --success:#F5B301; --success-soft:#3A2A0E;
  --warning:#FB923C; --warning-soft:#3A2210;
  --danger:#EF4444; --danger-soft:#3A1616;
  --info:#FACC15; --info-soft:#3A2F0C;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(120,20,10,.35);
}
[data-theme="dark"]{
  --bg-primary:#0E1116; --bg-secondary:#141821; --bg-tertiary:#1A1F29;
  --surface:#161A22; --surface-hover:#1E232D;
  --text-primary:#EDEFF3; --text-secondary:#98A2B3; --text-muted:#616A78;
  --border:#262C37;
  --accent:#7C87F7; --accent-hover:#909AF9; --accent-soft:#22264A;
  --success:#32D583; --success-soft:#123324;
  --warning:#F5A623; --warning-soft:#3A2A0E;
  --danger:#F97066; --danger-soft:#3A1717;
  --info:#53C7EA; --info-soft:#0F2E36;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.25);
}
[data-theme="forest"]{
  --bg-primary:#0F1912; --bg-secondary:#152018; --bg-tertiary:#1A271B;
  --surface:#17221A; --surface-hover:#1E2C22;
  --text-primary:#E7F0E8; --text-secondary:#9FB8A4; --text-muted:#66806B;
  --border:#25392A;
  --accent:#4FAE7C; --accent-hover:#63C290; --accent-soft:#163325;
  --success:#3DDC84; --success-soft:#123B26;
  --warning:#E0B84C; --warning-soft:#3A2F10;
  --danger:#E1685A; --danger-soft:#3A1B16;
  --info:#4FB6C4; --info-soft:#10333A;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.25);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg-primary); color:var(--text-primary);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  transition:background .35s ease, color .35s ease;
}
#root{min-height:100vh;}
button{font-family:inherit;cursor:pointer;}
button:focus-visible, a:focus-visible, [tabindex]:focus-visible, input:focus-visible, select:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px; border-radius:6px;
}
::selection{background:var(--accent-soft);}

.app{display:flex; min-height:100vh;}

/* ============ SIDEBAR ============ */
.sidebar{
  width:236px; flex-shrink:0; background:var(--bg-secondary);
  border-right:1px solid var(--border); display:flex; flex-direction:column;
  padding:20px 14px; position:sticky; top:0; height:100vh; transition:transform .3s ease, background .35s ease;
  z-index:40;
}
.brand{display:flex; align-items:center; gap:9px; padding:6px 8px 22px 8px;}
.brand-mark{
  width:28px;height:28px;border-radius:8px;
  background:linear-gradient(135deg,var(--accent),var(--accent-hover));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;
  flex-shrink:0;
}
.brand-name{font-weight:700; font-size:15.5px; letter-spacing:-.01em;}

.nav{display:flex; flex-direction:column; gap:2px;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:9px;
  color:var(--text-secondary); font-size:13.5px; font-weight:500; text-decoration:none;
  border:none; background:transparent; width:100%; text-align:left; transition:background .15s ease, color .15s ease;
}
.nav-item svg{flex-shrink:0;}
.nav-item:hover{background:var(--surface-hover); color:var(--text-primary);}
.nav-item.active{background:var(--accent-soft); color:var(--accent);}

.sidebar-bottom{margin-top:auto; display:flex; flex-direction:column; gap:2px; padding-top:12px; border-top:1px solid var(--border);}

.sidebar-overlay{display:none;}

/* ============ MAIN ============ */
.main{flex:1; min-width:0; display:flex; flex-direction:column;}

/* ---- topbar ---- */
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:12px 28px; border-bottom:1px solid var(--border); background:var(--bg-secondary);
  position:sticky; top:0; z-index:30; transition:background .35s ease;
}
.topbar-left{display:flex; align-items:center; gap:22px;}
.hamburger{display:none; background:none;border:none;color:var(--text-primary);padding:6px;border-radius:8px;}
.hamburger:hover{background:var(--surface-hover);}
.topnav{display:flex; align-items:center; gap:4px;}
.topnav-item{
  padding:7px 12px; border-radius:8px; font-size:13.5px; font-weight:500; color:var(--text-secondary);
  background:none; border:none; transition:background .15s ease,color .15s ease;
}
.topnav-item:hover{background:var(--surface-hover); color:var(--text-primary);}
.topnav-item.active{color:var(--text-primary); background:var(--bg-tertiary);}

.topbar-right{display:flex; align-items:center; gap:10px;}

.theme-switch{display:flex; align-items:center; gap:2px; background:var(--bg-tertiary); border-radius:9px; padding:3px;}
.theme-dot{
  width:26px;height:26px;border-radius:7px;border:1.5px solid transparent;background:none; display:flex;align-items:center;justify-content:center;
  color:var(--text-muted); transition:all .15s ease;
}
.theme-dot.active{background:var(--surface); color:var(--accent); border-color:var(--border); box-shadow:var(--shadow);}
.theme-dot:hover:not(.active){color:var(--text-secondary);}

.icon-btn{
  position:relative; width:36px;height:36px; border-radius:9px; border:1px solid var(--border);
  background:var(--surface); display:flex;align-items:center;justify-content:center; color:var(--text-secondary);
  transition:transform .15s ease, background .15s ease, color .15s ease;
}
.icon-btn:hover{background:var(--surface-hover); color:var(--text-primary);}
.badge-dot{
  position:absolute; top:-3px; right:-3px; min-width:16px; height:16px; padding:0 4px; border-radius:8px;
  background:var(--danger); color:#fff; font-size:9.5px; font-weight:700; display:flex;align-items:center;justify-content:center;
  border:2px solid var(--bg-secondary);
}

.profile-trigger{display:flex; align-items:center; gap:8px; background:none; border:none; padding:4px 6px 4px 4px; border-radius:10px;}
.profile-trigger:hover{background:var(--surface-hover);}
.avatar{
  width:32px;height:32px;border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--accent-hover));
  color:#fff; display:flex;align-items:center;justify-content:center; font-weight:700; font-size:13px; flex-shrink:0;
}
.profile-meta{display:flex; flex-direction:column; align-items:flex-start; line-height:1.2;}
.profile-name{font-size:13px; font-weight:600;}
.profile-role{font-size:11px; color:var(--text-muted);}

.dropdown-wrap{position:relative;}
.dropdown{
  position:absolute; top:calc(100% + 8px); right:0; width:280px; background:var(--surface);
  border:1px solid var(--border); border-radius:14px; box-shadow:0 12px 32px rgba(16,24,40,.14);
  padding:8px; z-index:60; opacity:0; transform:translateY(6px) scale(.98);
}
.dropdown.notif{width:320px;}
.dropdown-header{padding:8px 10px 6px; font-size:12.5px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em;}
.dropdown-item{
  display:flex; align-items:flex-start; gap:10px; padding:9px 10px; border-radius:9px; width:100%;
  background:none; border:none; text-align:left; color:var(--text-primary); font-size:13.5px;
}
.dropdown-item:hover{background:var(--surface-hover);}
.dropdown-item .sub{font-size:11.5px; color:var(--text-muted); margin-top:1px;}
.dropdown-divider{height:1px; background:var(--border); margin:6px 4px;}
.notif-item{padding:10px 10px; border-radius:10px;}
.notif-item + .notif-item{margin-top:2px;}
.notif-item p{margin:0; font-size:13px; line-height:1.4;}
.notif-item span{font-size:11px; color:var(--text-muted);}

/* ============ CONTENT ============ */
.content{padding:26px 28px 60px; max-width:1400px; width:100%; margin:0 auto;}

.greeting-row{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:22px; flex-wrap:wrap;}
.greeting h1{font-size:26px; margin:0 0 6px; font-weight:700; letter-spacing:-.02em;}
.greeting p.sub{margin:0; color:var(--text-secondary); font-size:14.5px;}
.greeting .focus-line{margin-top:10px; font-size:13.5px; color:var(--text-secondary); display:flex; align-items:center; gap:6px;}
.focus-line b{color:var(--text-primary); font-weight:600;}
.date-chip{
  display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border);
  padding:9px 14px; border-radius:11px; font-size:13px; color:var(--text-secondary); font-weight:500; box-shadow:var(--shadow);
}

/* KPI grid */
.kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px;}
.stat-card{
  background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px 18px 16px;
  box-shadow:var(--shadow); opacity:0; transform:translateY(20px);
  transition:transform .18s ease, border-color .18s ease;
}
.stat-card:hover{transform:translateY(-2px); border-color:var(--accent);}
.stat-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
.stat-label{font-size:11.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--text-muted);}
.stat-icon{width:30px;height:30px;border-radius:9px; display:flex;align-items:center;justify-content:center;}
.stat-value{font-size:30px; font-weight:700; letter-spacing:-.02em; line-height:1;}
.stat-foot{font-size:12.5px; color:var(--text-secondary); margin-top:8px;}

/* generic section card */
.panel{
  background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow);
  opacity:0; transform:translateY(20px); transition:border-color .18s ease;
}
.panel-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:18px 20px 4px;}
.panel-title{font-size:15.5px; font-weight:700; margin:0; letter-spacing:-.01em;}
.panel-sub{font-size:12.5px; color:var(--text-muted); margin:2px 0 0;}
.panel-link{background:none;border:none;color:var(--accent); font-size:12.5px; font-weight:600; padding:4px 6px; border-radius:6px; white-space:nowrap;}
.panel-link:hover{background:var(--accent-soft);}
.panel-body{padding:14px 20px 20px;}

.dash-grid{display:grid; grid-template-columns:1.65fr 1fr; gap:16px; margin-bottom:16px; align-items:start;}
.dash-grid-2{display:grid; grid-template-columns:1.15fr .85fr 1fr; gap:16px; margin-bottom:16px; align-items:start;}
.stack{display:flex; flex-direction:column; gap:16px;}

/* Tasks */
.task-row{
  display:flex; align-items:center; gap:14px; padding:13px 12px; border-radius:12px; border:1px solid transparent;
  transition:background .15s ease, border-color .15s ease; cursor:pointer;
}
.task-row:hover{background:var(--surface-hover); border-color:var(--border);}
.task-row + .task-row{margin-top:2px;}
.task-check{
  width:20px;height:20px;border-radius:6px;border:1.6px solid var(--border); flex-shrink:0; display:flex;align-items:center;justify-content:center;
  background:var(--bg-secondary); transition:all .15s ease;
}
.task-check.done{background:var(--success); border-color:var(--success);}
.task-main{flex:1; min-width:0;}
.task-title-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.task-title{font-size:14px; font-weight:600; margin:0;}
.task-title.done{text-decoration:line-through; color:var(--text-muted);}
.task-skills{font-size:12px; color:var(--text-muted); margin-top:2px;}
.task-side{display:flex; align-items:center; gap:16px; flex-shrink:0;}
.task-deadline{font-size:12px; color:var(--text-secondary); min-width:78px; text-align:right;}
.task-progress-wrap{width:110px;}
.task-progress-track{height:6px; border-radius:4px; background:var(--bg-tertiary); overflow:hidden;}
.task-progress-fill{height:100%; border-radius:4px; width:0%; background:var(--accent);}
.task-progress-pct{font-size:11px; color:var(--text-muted); margin-top:4px; text-align:right;}

.badge{
  display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:3px 8px;
  border-radius:99px; letter-spacing:.02em; white-space:nowrap;
}
.badge.priority-high{background:var(--danger-soft); color:var(--danger);}
.badge.priority-medium{background:var(--warning-soft); color:var(--warning);}
.badge.priority-low{background:var(--info-soft); color:var(--info);}
.badge.status-todo{background:var(--bg-tertiary); color:var(--text-secondary);}
.badge.status-inprogress{background:var(--accent-soft); color:var(--accent);}
.badge.status-completed{background:var(--success-soft); color:var(--success);}
.badge.status-atrisk{background:var(--danger-soft); color:var(--danger);}

@media (max-width:1024px){
  .task-side{gap:10px;}
  .task-progress-wrap{display:none;}
}

/* Workload card */
.workload-ring-row{display:flex; align-items:center; gap:16px;}
.workload-pct{font-size:34px; font-weight:700; letter-spacing:-.02em;}
.workload-tag{font-size:12.5px; color:var(--success); font-weight:600; background:var(--success-soft); padding:3px 9px; border-radius:99px; display:inline-block; margin-top:4px;}
.workload-track{height:9px; border-radius:6px; background:var(--bg-tertiary); overflow:hidden; margin-top:14px;}
.workload-fill{height:100%; width:0%; border-radius:6px; background:linear-gradient(90deg,var(--accent),var(--accent-hover));}
.workload-stats{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:16px;}
.workload-stat{background:var(--bg-tertiary); border-radius:11px; padding:10px 12px;}
.workload-stat .n{font-size:16px; font-weight:700;}
.workload-stat .l{font-size:11px; color:var(--text-muted); margin-top:2px;}

/* Deadlines */
.deadline-item{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 8px; border-radius:10px;}
.deadline-item:hover{background:var(--surface-hover);}
.deadline-item + .deadline-item{border-top:1px solid var(--border);}
.deadline-name{font-size:13.5px; font-weight:600;}
.deadline-time{font-size:11.5px; color:var(--text-muted); margin-top:1px;}
.deadline-item.at-risk{animation:riskflash 1.1s ease 1;}
@keyframes riskflash{
  0%{background:var(--danger-soft);} 100%{background:transparent;}
}

/* Calendar */
.cal-head{display:flex; align-items:center; justify-content:space-between; padding:0 2px 12px;}
.cal-nav-btn{width:28px;height:28px;border-radius:8px;border:1px solid var(--border); background:var(--surface); color:var(--text-secondary); display:flex;align-items:center;justify-content:center;}
.cal-nav-btn:hover{background:var(--surface-hover); color:var(--text-primary);}
.cal-month{font-size:13.5px; font-weight:700;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
.cal-dow{font-size:10.5px; color:var(--text-muted); text-align:center; font-weight:700; padding-bottom:4px;}
.cal-cell{
  aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:9px;
  font-size:12.5px; color:var(--text-secondary); position:relative; background:none; border:1px solid transparent;
}
.cal-cell.pad{visibility:hidden;}
.cal-cell:not(.pad):hover{background:var(--surface-hover); cursor:pointer;}
.cal-cell.today{border-color:var(--accent); color:var(--accent); font-weight:700;}
.cal-cell.selected{background:var(--accent); color:#fff;}
.cal-dots{display:flex; gap:2px; position:absolute; bottom:4px;}
.cal-dot{width:4px;height:4px;border-radius:50%;}
.cal-events{margin-top:14px; border-top:1px solid var(--border); padding-top:12px;}
.cal-event{display:flex; align-items:center; gap:8px; font-size:12.5px; padding:6px 2px; color:var(--text-secondary);}
.cal-event .dot{width:6px;height:6px;border-radius:50%; flex-shrink:0;}
.cal-empty{font-size:12.5px; color:var(--text-muted); padding:6px 2px;}

/* Activity / messages */
.activity-item, .message-item{display:flex; gap:12px; padding:11px 4px;}
.activity-item + .activity-item, .message-item + .message-item{border-top:1px solid var(--border);}
.activity-icon{
  width:32px;height:32px; border-radius:9px; background:var(--accent-soft); color:var(--accent);
  display:flex;align-items:center;justify-content:center; flex-shrink:0;
}
.activity-text{font-size:13px; line-height:1.4;}
.activity-time{font-size:11px; color:var(--text-muted); margin-top:2px;}

.message-item{align-items:flex-start; cursor:pointer; border-radius:10px; padding:10px 8px;}
.message-item:hover{background:var(--surface-hover);}
.message-item.unread .message-from{position:relative;}
.message-item.unread .message-from::after{content:""; width:7px;height:7px;border-radius:50%;background:var(--accent); display:inline-block; margin-left:6px;}
.message-from{font-size:13px; font-weight:700;}
.message-text{font-size:12.5px; color:var(--text-secondary); margin-top:2px; line-height:1.4;}
.message-time{font-size:11px; color:var(--text-muted); flex-shrink:0; margin-left:auto; padding-left:8px;}

/* Progress charts (weekly combo chart + status donut) */
.progress-grid{display:grid; grid-template-columns:1.65fr 1fr; gap:24px; align-items:center;}
.chart-legend{display:flex; align-items:center; gap:16px; margin-bottom:10px; flex-wrap:wrap;}
.chart-legend .lg-item{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-secondary); font-weight:600;}
.chart-legend .lg-dot{width:8px;height:8px;border-radius:2px; display:inline-block;}
.chart-legend .lg-dot.line{width:12px;height:2px;border-radius:1px;}
.chart-legend .lg-dot.dashed{width:12px;height:0;border-top:2px dashed var(--warning); background:none; border-radius:0;}
.chart-avg-pill{margin-left:auto; font-size:11.5px; font-weight:700; color:var(--text-primary); background:var(--bg-tertiary); padding:4px 10px; border-radius:99px;}
.progress-svg{width:100%; height:210px; overflow:visible; display:block;}
.chart-bar{cursor:pointer; transition:opacity .15s ease;}
.chart-bar:hover{opacity:.85;}
.chart-point{cursor:pointer;}
.chart-tooltip-bg{filter:drop-shadow(0 3px 8px rgba(16,24,40,.18));}

@media (max-width:1180px){
  .progress-grid{grid-template-columns:1fr;}
}

.donut-wrap{display:flex; flex-direction:column; align-items:center; gap:16px;}
.donut-svg-wrap{position:relative; width:158px; height:158px;}
.donut-svg{width:158px; height:158px; transform:rotate(-90deg);}
.donut-center{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  transform:rotate(0deg);
}
.donut-center .n{font-size:22px; font-weight:700; letter-spacing:-.02em; line-height:1;}
.donut-center .l{font-size:10.5px; color:var(--text-muted); font-weight:600; margin-top:3px;}
.donut-legend{display:flex; flex-direction:column; gap:9px; width:100%;}
.donut-legend-item{display:flex; align-items:center; gap:9px; font-size:12.5px;}
.donut-legend-item .dot{width:8px;height:8px;border-radius:50%; flex-shrink:0;}
.donut-legend-item .name{flex:1; color:var(--text-secondary);}
.donut-legend-item .val{font-weight:700;}

/* Availability */
.avail-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.avail-select{
  appearance:none; background:var(--bg-tertiary); border:1px solid var(--border); border-radius:9px; padding:8px 30px 8px 12px;
  font-size:13px; font-weight:600; color:var(--text-primary);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%235B6472' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat:no-repeat; background-position:right 10px center;
}
.avail-dot{width:9px;height:9px;border-radius:50%;}

/* Toast */
.toast{
  position:fixed; bottom:26px; left:50%; transform:translate(-50%, 20px); background:var(--text-primary); color:var(--bg-primary);
  padding:12px 20px; border-radius:11px; font-size:13.5px; font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,.25);
  display:flex; align-items:center; gap:10px; z-index:200; opacity:0; pointer-events:none;
}

/* Modal */
.modal-overlay{
  position:fixed; inset:0; background:rgba(10,12,16,.45); display:flex; align-items:center; justify-content:center;
  z-index:100; padding:20px; opacity:0;
}
.modal-card{
  background:var(--surface); border-radius:18px; width:100%; max-width:480px; padding:26px; box-shadow:0 24px 60px rgba(0,0,0,.3);
  opacity:0; transform:translateY(10px) scale(.96); border:1px solid var(--border);
}
.modal-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:6px;}
.modal-title{font-size:18px; font-weight:700; margin:0;}
.modal-close{background:none;border:none;color:var(--text-muted); width:30px;height:30px;border-radius:8px; display:flex;align-items:center;justify-content:center; flex-shrink:0;}
.modal-close:hover{background:var(--surface-hover); color:var(--text-primary);}
.modal-desc{font-size:13.5px; color:var(--text-secondary); line-height:1.5; margin:10px 0 16px;}
.modal-meta{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:18px;}
.modal-meta-item .l{font-size:11px; color:var(--text-muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px;}
.modal-status-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
.status-pill{
  border:1px solid var(--border); background:var(--bg-secondary); padding:7px 12px; border-radius:9px; font-size:12.5px; font-weight:600;
  color:var(--text-secondary);
}
.status-pill.active{border-color:var(--accent); color:var(--accent); background:var(--accent-soft);}
.modal-progress-label{display:flex; justify-content:space-between; font-size:12px; color:var(--text-muted); margin-bottom:6px;}
input[type="range"]{width:100%; accent-color:var(--accent);}
.modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:20px;}
.btn{padding:9px 16px; border-radius:9px; font-size:13.5px; font-weight:600; border:1px solid var(--border); background:var(--bg-secondary); color:var(--text-primary);}
.btn:hover{background:var(--surface-hover);}
.btn.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
.btn.primary:hover{background:var(--accent-hover);}

/* section headings for mobile stacked task cards */
@media (max-width:1180px){
  .dash-grid, .dash-grid-2{grid-template-columns:1fr;}
}

@media (max-width:900px){
  .kpi-grid{grid-template-columns:1fr 1fr;}
  .sidebar{
    position:fixed; left:0; top:0; transform:translateX(-100%); box-shadow:0 0 0 rgba(0,0,0,0); z-index:80;
  }
  .sidebar.open{transform:translateX(0); box-shadow:20px 0 60px rgba(0,0,0,.25);}
  .hamburger{display:flex;}
  .topnav{display:none;}
  .sidebar-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:70;}
  .sidebar-overlay.show{display:block;}
}

@media (max-width:600px){
  .content{padding:18px 14px 50px;}
  .kpi-grid{grid-template-columns:1fr 1fr; gap:10px;}
  .task-side{flex-direction:column; align-items:flex-end; gap:6px;}
  .task-row{flex-wrap:wrap;}
  .profile-meta{display:none;}
  .greeting h1{font-size:21px;}
  .modal-meta{grid-template-columns:1fr;}
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

/* ---------------- ICONS (tiny inline SVGs) ---------------- */
const Icon = ({ children, size=17 }) => (

const IconGrid = (p)=><Icon {...p}><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></Icon>;

const IconSettings = (p)=><Icon {...p}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></Icon>;
const IconUser = (p)=><Icon {...p}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></Icon>;
const IconBell = (p)=><Icon {...p}><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></Icon>;
const IconSun = (p)=><Icon {...p}><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></Icon>;
const IconCoffee = (p)=><Icon {...p}><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8z"/><path d="M6 1v3M10 1v3M14 1v3"/></Icon>;
const IconMoon = (p)=><Icon {...p}><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></Icon>;
const IconLeaf = (p)=><Icon {...p}><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 3.5 18 2c1 5 1.5 8.5-.5 13-1.5 2.5-4 5-6.5 5z"/><path d="M2 22c5-2 8-4.5 11-9"/></Icon>;
const IconSunset = (p)=><Icon {...p}><path d="M17 18a5 5 0 0 0-10 0"/><path d="M12 9V2M4.2 10.2l1.4 1.4M1 18h2M21 18h2M18.4 11.6l1.4-1.4M23 22H1M8 6l4-4 4 4"/></Icon>;
const IconChevronLeft = (p)=><Icon {...p}><path d="M15 18l-6-6 6-6"/></Icon>;
const IconChevronRight = (p)=><Icon {...p}><path d="M9 18l6-6-6-6"/></Icon>;
const IconLogOut = (p)=><Icon {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></Icon>;
const IconMenu = (p)=><Icon {...p}><path d="M3 12h18M3 6h18M3 18h18"/></Icon>;
const IconX = (p)=><Icon {...p}><path d="M18 6L6 18M6 6l18 18"/></Icon>;
const IconClock = (p)=><Icon {...p}><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></Icon>;
const IconLayers = (p)=><Icon {...p}><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></Icon>;
const IconTrend = (p)=><Icon {...p}><path d="M23 6l-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/></Icon>;
const IconGauge = (p)=><Icon {...p}><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M12 12l3-4"/><path d="M4.6 19a10 10 0 1 1 14.8 0"/></Icon>;
const IconFlag = (p)=><Icon {...p}><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V4s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22V4"/></Icon>;

/* ---------------- MOCK DATA ---------------- */
const currentUser = { name: "Divay", role: "Frontend Developer", userType: "Employee", avatarLetter: "D" };

const initialTasks = [
  { id: 1, title: "Build Authentication UI", skills: ["React", "UI/UX"], priority: "High", status: "In Progress", progress: 70, deadline: "Tomorrow", deadlineRank: 1, description: "Design and implement the login, signup, and password-reset screens, wired to mock auth state and matching the Loadwise design system." , effort: "8h" },
  { id: 2, title: "Dashboard Responsive Design", skills: ["CSS", "Responsive Design"], priority: "Medium", status: "In Progress", progress: 45, deadline: "In 2 days", deadlineRank: 2, description: "Make the dashboard grid adapt cleanly across desktop, tablet, and mobile breakpoints without horizontal overflow.", effort: "6h" },
  { id: 3, title: "Write API Documentation", skills: ["Documentation"], priority: "Low", status: "To Do", progress: 20, deadline: "In 5 days", deadlineRank: 4, description: "Document the task, workload, and calendar endpoints the frontend will eventually consume.", effort: "4h" },
  { id: 4, title: "User Profile UI", skills: ["React", "CSS"], priority: "Medium", status: "To Do", progress: 10, deadline: "In 6 days", deadlineRank: 5, description: "Build the personal profile screen: avatar, role, availability, and account settings.", effort: "5h" },
  { id: 5, title: "Integration Testing Pass", skills: ["QA", "React"], priority: "Medium", status: "At Risk", progress: 30, deadline: "In 4 days", deadlineRank: 3, description: "Run through the core task and calendar flows end to end and log any regressions before release.", effort: "5h" },
  { id: 6, title: "Design Review Follow-ups", skills: ["UI/UX"], priority: "Low", status: "To Do", progress: 0, deadline: "In 7 days", deadlineRank: 6, description: "Address feedback from Thursday's design review on spacing and color contrast.", effort: "3h" },
];

const teamActivity = [
  { id: 1, text: "New task assigned to you — Integration Testing Pass", time: "9:05 AM", icon: IconLayers },
  { id: 2, text: "Team sprint planning scheduled for 3:00 PM", time: "9:12 AM", icon: IconCalendar },
  { id: 3, text: "Project announcement posted in #loadwise-general", time: "8:40 AM", icon: IconFlag },
  { id: 4, text: "Design review scheduled for Thursday", time: "Yesterday", icon: IconUser },
  { id: 5, text: "Manager commented on Authentication UI", time: "Yesterday", icon: IconMessage },
];

const initialMessages = [
  { id: 1, from: "Manager", text: "Please review the authentication UI when you get a chance.", time: "10:32 AM", unread: true },
  { id: 2, from: "Team", text: "Sprint planning starts at 3 PM — join the usual link.", time: "9:12 AM", unread: true },
  { id: 3, from: "Manager", text: "Nice progress on the responsive layout so far.", time: "Yesterday", unread: false },
];

const weekProgress = [
  { day: "Mon", value: 40 },
  { day: "Tue", value: 62 },
  { day: "Wed", value: 51 },
  { day: "Thu", value: 78 },
  { day: "Fri", value: 68 },
];

const deadlines = [
  { id: 1, name: "Authentication API", time: "Tomorrow", priority: "High", risk: false },
  { id: 2, name: "Dashboard UI", time: "2 days", priority: "Medium", risk: false },
  { id: 3, name: "Testing", time: "4 days", priority: "Medium", risk: true },
  { id: 4, name: "Documentation", time: "6 days", priority: "Low", risk: false },
];

const THEMES = [
  { id: "white", label: "White", icon: IconSun },
  { id: "dark", label: "Dark", icon: IconMoon },
  { id: "forest", label: "Forest", icon: IconLeaf },
  { id: "twilight", label: "Twilight", icon: IconSunset },
];

const NAV_ITEMS = [
  { id: "dashboard", label: "Dashboard", icon: IconGrid },
  { id: "tasks", label: "My Tasks", icon: IconCheck2 },
  { id: "calendar", label: "Calendar", icon: IconCalendar },
  { id: "activity", label: "Activity", icon: IconActivity },
  { id: "messages", label: "Messages", icon: IconMessage },
];

const priorityClass = (p) => p === "High" ? "priority-high" : p === "Medium" ? "priority-medium" : "priority-low";
const statusClass = (s) => s === "Completed" ? "status-completed" : s === "In Progress" ? "status-inprogress" : s === "At Risk" ? "status-atrisk" : "status-todo";
const priorityColorVar = (p) => p === "High" ? "var(--danger)" : p === "Medium" ? "var(--warning)" : "var(--info)";

/* ---------------- SMALL REUSABLE PIECES ---------------- */
function Badge({ text, kind }) {
  return <span className={"badge " + kind}>{text}</span>;
}

function ProgressBar({ value }) {
  return (
    <div className="task-progress-track">
      <div className="task-progress-fill" data-value={value}></div>
    </div>
  );
}

/* ---------------- APP ---------------- */
function App(){
  const [theme, setTheme] = useState("white");
  const [activeNav, setActiveNav] = useState("dashboard");
  const [tasks, setTasks] = useState(initialTasks);
  const [selectedTask, setSelectedTask] = useState(null);
  const [messages, setMessages] = useState(initialMessages);
  const [notifOpen, setNotifOpen] = useState(false);
  const [profileOpen, setProfileOpen] = useState(false);
  const [mobileNavOpen, setMobileNavOpen] = useState(false);
  const [availability, setAvailability] = useState("Available");
  const [toast, setToast] = useState(null);
  const [calDate, setCalDate] = useState(new Date(2026, 7, 1));
  const [selectedDay, setSelectedDay] = useState(19);
  const toastTimer = useRef(null);
  const toastRef = useRef(null);

  useEffect(() => { document.documentElement.setAttribute("data-theme", theme); }, [theme]);

  /* derived KPI values from live task state */
  const activeTaskCount = tasks.filter(t => t.status !== "Completed").length;
  const inProgressCount = tasks.filter(t => t.status === "In Progress").length;
  const dueSoonCount = 2;
  const avgProgress = Math.round(tasks.reduce((a,t)=>a+t.progress,0) / tasks.length);
  const workload = Math.max(30, Math.min(96, Math.round(72 - (initialTasks.length - activeTaskCount) * 6)));

  /* ---------- page-load entrance animation ---------- */
  useEffect(() => {
    if (!window.anime) return;
    const tl = anime.timeline({ easing: "easeOutCubic" });
    tl.add({ targets: ".js-header", opacity: [0,1], translateY: [-10,0], duration: 400 })
      .add({ targets: ".js-greeting", opacity: [0,1], translateY: [16,0], duration: 450 }, "-=250")
      .add({ targets: ".stat-card", opacity: [0,1], translateY: [20,0], duration: 500, delay: anime.stagger(80) }, "-=250")
      .add({ targets: ".panel", opacity: [0,1], translateY: [20,0], duration: 500, delay: anime.stagger(90) }, "-=300");

    // KPI counters
    animateCount("#kpi-tasks", activeTaskCount);
    animateCount("#kpi-due", dueSoonCount);
    animateCount("#kpi-workload", workload, "%");
    animateCount("#kpi-progress", avgProgress, "%");

    // workload bar + task progress bars + weekly bars
    anime({ targets: "#workload-fill", width: workload + "%", duration: 900, easing: "easeOutQuart", delay: 500 });
    anime({ targets: ".task-progress-fill", width: (el)=> el.getAttribute("data-value")+"%", duration: 800, easing: "easeOutQuart", delay: anime.stagger(60, {start:400}) });
  }, []); // run once on mount

  /* re-animate task progress bars, KPI counters, and workload whenever task state changes */
  const firstRun = useRef(true);
  useEffect(() => {
    if (firstRun.current){ firstRun.current = false; return; }
    if (!window.anime) return;
    anime({ targets: ".task-progress-fill", width: (el)=> el.getAttribute("data-value")+"%", duration: 500, easing: "easeOutQuart" });
    anime({ targets: "#workload-fill", width: workload + "%", duration: 500, easing: "easeOutQuart" });
    animateCount("#kpi-tasks", activeTaskCount);
    animateCount("#kpi-progress", avgProgress, "%");
    animateCount("#kpi-workload", workload, "%");
  }, [tasks]);

  function animateCount(selector, to, suffix=""){
    if (!window.anime) return;
    const el = document.querySelector(selector);
    if (!el) return;
    const obj = { val: 0 };
    anime({
      targets: obj, val: to, round: 1, duration: 900, easing: "easeOutCubic", delay: 250,
      update: () => { el.textContent = obj.val + suffix; }
    });
  }

  function openTask(task){
    setSelectedTask(task);
    requestAnimationFrame(() => {
      if (!window.anime) return;
      anime({ targets: ".modal-overlay", opacity: [0,1], duration: 200, easing: "easeOutQuad" });
      anime({ targets: ".modal-card", opacity: [0,1], translateY: [10,0], scale: [0.96,1], duration: 260, easing: "easeOutCubic" });
    });
  }

  function closeTask(){
    if (window.anime){
      anime({ targets: ".modal-overlay", opacity: [1,0], duration: 180, easing: "easeInQuad" });
      anime({ targets: ".modal-card", opacity: [1,0], translateY: [0,8], scale: [1,0.97], duration: 200, easing: "easeInCubic",
        complete: () => setSelectedTask(null) });
    } else { setSelectedTask(null); }
  }

  function showToast(msg){
    setToast(msg);
    clearTimeout(toastTimer.current);
    requestAnimationFrame(() => {
      if (window.anime){
        anime({ targets: ".toast", opacity: [0,1], translateY: [20,0], duration: 260, easing: "easeOutCubic" });
      }
    });
    toastTimer.current = setTimeout(() => {
      if (window.anime){
        anime({ targets: ".toast", opacity: [1,0], translateY: [0,16], duration: 220, easing: "easeInCubic", complete: () => setToast(null) });
      } else setToast(null);
    }, 2400);
  }

  function updateTaskStatus(id, status){
    setTasks(prev => prev.map(t => {
      if (t.id !== id) return t;
      let progress = t.progress;
      if (status === "Completed") progress = 100;
      if (status === "To Do" && t.progress === 100) progress = 0;
      return { ...t, status, progress };
    }));
    setSelectedTask(prev => prev && { ...prev, status, progress: status === "Completed" ? 100 : prev.progress });
    if (status === "Completed") showToast("Task marked complete 🎉");
  }

  function updateTaskProgress(id, progress){
    setTasks(prev => prev.map(t => t.id === id ? { ...t, progress, status: progress === 100 ? "Completed" : (t.status === "To Do" && progress > 0 ? "In Progress" : t.status) } : t));
    setSelectedTask(prev => prev && { ...prev, progress });
  }

  function quickComplete(e, task){
    e.stopPropagation();
    if (task.status === "Completed") return;
    const row = e.currentTarget.closest(".task-row");
    if (window.anime && row){
      anime({ targets: row.querySelector(".task-check"), scale: [1,1.25,1], duration: 350, easing: "easeOutBack" });
      anime({ targets: row, backgroundColor: ["rgba(18,183,106,0.12)", "rgba(0,0,0,0)"], duration: 700, easing: "easeOutQuad" });
    }
    updateTaskStatus(task.id, "Completed");
  }

  function changeAvailability(v){
    setAvailability(v);
    showToast("Availability updated");
  }

  const monthLabel = calDate.toLocaleDateString("en-US", { month: "long", year: "numeric" });
  function shiftMonth(delta){
    const cal = document.querySelector(".cal-grid");
    const doShift = () => setCalDate(d => new Date(d.getFullYear(), d.getMonth()+delta, 1));
    if (window.anime && cal){
      anime({ targets: cal, opacity: [1,0], duration: 140, easing: "easeInQuad", complete: () => {
        doShift();
        requestAnimationFrame(() => anime({ targets: ".cal-grid", opacity: [0,1], duration: 220, easing: "easeOutQuad" }));
      }});
    } else doShift();
  }
  function pickDay(d){
    setSelectedDay(d);
    requestAnimationFrame(() => {
      if (window.anime) anime({ targets: ".cal-cell.selected", scale: [0.85,1], duration: 220, easing: "easeOutBack" });
    });
  }

  function toggleNotif(){
    const next = !notifOpen;
    setProfileOpen(false);
    setNotifOpen(next);
    if (next) requestAnimationFrame(()=> animateDropdown(".dropdown.notif"));
  }
  function toggleProfile(){
    const next = !profileOpen;
    setNotifOpen(false);
    setProfileOpen(next);
    if (next) requestAnimationFrame(()=> animateDropdown(".dropdown.profile"));
  }
  function animateDropdown(sel){
    if (!window.anime) return;
    anime({ targets: sel, opacity: [0,1], translateY: [6,0], scale: [0.98,1], duration: 220, easing: "easeOutCubic" });
  }

  function openMessage(m){
    setMessages(prev => prev.map(x => x.id === m.id ? { ...x, unread: false } : x));
  }

  const unreadCount = messages.filter(m => m.unread).length;

  return (
    <div className="app" onClick={() => { setNotifOpen(false); setProfileOpen(false); }}>
      {mobileNavOpen && <div className="sidebar-overlay show" onClick={()=>setMobileNavOpen(false)}></div>}

      <Sidebar activeNav={activeNav} setActiveNav={setActiveNav} open={mobileNavOpen} onClose={()=>setMobileNavOpen(false)} />

      <div className="main">
        <Topbar
          theme={theme} setTheme={setTheme}
          activeNav={activeNav} setActiveNav={setActiveNav}
          notifOpen={notifOpen} toggleNotif={toggleNotif}
          profileOpen={profileOpen} toggleProfile={toggleProfile}
          unreadCount={unreadCount}
          onHamburger={()=>setMobileNavOpen(true)}
          onLogout={()=>showToast("Signed out (demo only)")}
        />

        <div className="content">
          <div className="greeting-row js-greeting">
            <div className="greeting">

/* ---------------- WEEKLY COMBO CHART (bars + trend line + target) ---------------- */
function WeeklyProgressChart({ data, target }){
  const [hover, setHover] = useState(null);
  const wrapRef = useRef(null);
  const lineRef = useRef(null);

  const width = 560, height = 210, padL = 30, padR = 10, padT = 14, padB = 26;
  const chartW = width - padL - padR;
  const chartH = height - padT - padB;
  const stepX = chartW / data.length;
  const barW = Math.min(30, stepX - 20);

  const xFor = (i) => padL + stepX * i + stepX / 2;
  const yFor = (v) => padT + chartH - (v / 100) * chartH;
  const points = data.map((d, i) => ({ x: xFor(i), y: yFor(d.value) }));
  const linePath = points.map((p, i) => (i === 0 ? "M" : "L") + p.x.toFixed(1) + "," + p.y.toFixed(1)).join(" ");
  const areaPath = linePath + ` L ${points[points.length-1].x.toFixed(1)},${yFor(0)} L ${points[0].x.toFixed(1)},${yFor(0)} Z`;
  const avg = Math.round(data.reduce((a, d) => a + d.value, 0) / data.length);

  useEffect(() => {
    if (!window.anime || !wrapRef.current) return;
    const root = wrapRef.current;
    const bars = root.querySelectorAll(".chart-bar");
    const dots = root.querySelectorAll(".chart-point");
    const area = root.querySelector(".chart-area");
    const line = lineRef.current;

    anime({
      targets: bars,
      height: (el) => el.getAttribute("data-h"),
      y: (el) => el.getAttribute("data-y"),
      duration: 750, easing: "easeOutQuart", delay: anime.stagger(70, { start: 150 }),
    });

    if (line){
      const len = line.getTotalLength();
      line.style.strokeDasharray = len;
      line.style.strokeDashoffset = len;
      anime({ targets: line, strokeDashoffset: [len, 0], duration: 900, easing: "easeOutQuart", delay: 300 });
    }
    if (area){
      anime({ targets: area, opacity: [0, 1], duration: 600, easing: "easeOutQuad", delay: 700 });
    }
    if (dots.length){
      anime({ targets: dots, opacity: [0, 1], scale: [0, 1], duration: 350, easing: "easeOutBack", delay: anime.stagger(70, { start: 850 }) });
    }
  }, []);

  return (
    <div ref={wrapRef}>
      <div className="chart-legend">
        <span className="lg-item"><span className="lg-dot" style={{background:"var(--accent)"}}></span>Daily completion</span>
        <span className="lg-item"><span className="lg-dot dashed"></span>Weekly target ({target}%)</span>
        <span className="chart-avg-pill">Avg {avg}%</span>
      </div>
      <svg className="progress-svg" viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="none" onMouseLeave={() => setHover(null)}>
        <defs>
          <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" style={{stopColor:"var(--accent-hover)"}} />
            <stop offset="100%" style={{stopColor:"var(--accent)", stopOpacity:0.55}} />
          </linearGradient>
          <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" style={{stopColor:"var(--accent)", stopOpacity:0.32}} />
            <stop offset="100%" style={{stopColor:"var(--accent)", stopOpacity:0}} />
          </linearGradient>
        </defs>

        {[0, 25, 50, 75, 100].map((v) => (
          <g key={v}>
            <line x1={padL} x2={width - padR} y1={yFor(v)} y2={yFor(v)} style={{stroke:"var(--border)"}} strokeWidth="1" strokeDasharray={v === 0 ? "0" : "3,4"} />
            <text x={padL - 8} y={yFor(v) + 3} textAnchor="end" fontSize="9.5" style={{fill:"var(--text-muted)"}}>{v}</text>
          </g>
        ))}

        <line x1={padL} x2={width - padR} y1={yFor(target)} y2={yFor(target)} style={{stroke:"var(--warning)"}} strokeWidth="1.4" strokeDasharray="5,4" opacity="0.75" />

        {data.map((d, i) => {
          const finalY = yFor(d.value);
          const finalH = yFor(0) - finalY;
          return (
            <rect key={d.day} className="chart-bar" data-y={finalY} data-h={finalH}
              x={xFor(i) - barW / 2} y={yFor(0)} width={barW} height="0" rx="6"
              fill="url(#barGrad)" onMouseEnter={() => setHover(i)} onFocus={() => setHover(i)} tabIndex="0" />
          );
        })}

        <path className="chart-area" d={areaPath} fill="url(#areaGrad)" opacity="0" />
        <path ref={lineRef} className="chart-line" d={linePath} fill="none" style={{stroke:"var(--accent)"}} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" />

        {points.map((p, i) => (
          <circle key={i} className="chart-point" cx={p.x} cy={p.y} r={hover === i ? 5.5 : 3.5}
            style={{fill:"var(--bg-secondary)", stroke:"var(--accent)"}} strokeWidth="2.2"
            onMouseEnter={() => setHover(i)} />
        ))}

        {data.map((d, i) => (
          <text key={d.day} x={xFor(i)} y={height - 8} textAnchor="middle" fontSize="10.5" fontWeight="600" style={{fill:"var(--text-muted)"}}>{d.day}</text>
        ))}

        {hover != null && (
          <g transform={`translate(${points[hover].x},${points[hover].y - 16})`}>
            <rect className="chart-tooltip-bg" x="-19" y="-22" width="38" height="20" rx="6" style={{fill:"var(--text-primary)"}} />
            <text x="0" y="-8" textAnchor="middle" fontSize="10.5" fontWeight="700" style={{fill:"var(--bg-secondary)"}}>{data[hover].value}%</text>
          </g>
        )}
      </svg>
    </div>
  );
}

/* ---------------- TASK STATUS DONUT ---------------- */
function TaskStatusDonut({ tasks }){
  const wrapRef = useRef(null);
  const counts = ["To Do", "In Progress", "At Risk", "Completed"].map(status => ({
    status, count: tasks.filter(t => t.status === status).length,
  }));
  const colors = { "To Do": "var(--text-muted)", "In Progress": "var(--accent)", "At Risk": "var(--danger)", "Completed": "var(--success)" };
  const total = tasks.length || 1;
  const r = 60, cx = 79, cy = 79, sw = 16;
  const circumference = 2 * Math.PI * r;

  let offsetAcc = 0;
  const segments = counts.filter(c => c.count > 0).map(c => {
    const frac = c.count / total;
    const dash = frac * circumference;
    const seg = { ...c, dash, gap: circumference - dash, rotate: (offsetAcc / total) * 360 };
    offsetAcc += c.count;
    return seg;
  });

  useEffect(() => {
    if (!window.anime || !wrapRef.current) return;
    const arcs = wrapRef.current.querySelectorAll(".donut-arc");
    arcs.forEach((el) => { el.style.strokeDasharray = circumference; el.style.strokeDashoffset = circumference; });
    anime({ targets: arcs, strokeDashoffset: (el) => circumference - parseFloat(el.getAttribute("data-dash")), duration: 800, easing: "easeOutQuart", delay: anime.stagger(120, { start: 200 }) });
    anime({ targets: ".donut-legend-item", opacity: [0, 1], translateX: [-6, 0], duration: 350, easing: "easeOutQuad", delay: anime.stagger(60, { start: 500 }) });
  }, []);

  return (
    <div className="donut-wrap" ref={wrapRef}>
      <div className="donut-svg-wrap">
        <svg className="donut-svg" viewBox="0 0 158 158">
          <circle cx={cx} cy={cy} r={r} fill="none" style={{stroke:"var(--bg-tertiary)"}} strokeWidth={sw} />
          {segments.map((s) => (
            <circle key={s.status} className="donut-arc" data-dash={s.dash}
              cx={cx} cy={cy} r={r} fill="none" style={{stroke: colors[s.status]}} strokeWidth={sw}
              strokeLinecap="butt" transform={`rotate(${s.rotate} ${cx} ${cy})`} />
          ))}
        </svg>
        <div className="donut-center">
          <span className="n">{tasks.length}</span>
          <span className="l">Total Tasks</span>
        </div>
      </div>
      <div className="donut-legend">
        {counts.map(c => (
          <div className="donut-legend-item" key={c.status}>
            <span className="dot" style={{background: colors[c.status]}}></span>
            <span className="name">{c.status}</span>
            <span className="val">{c.count}</span>
          </div>
        ))}
      </div>
    </div>
  );
}


function CalendarWidget({ calDate, shiftMonth, selectedDay, pickDay, monthLabel }){
  const year = calDate.getFullYear(), month = calDate.getMonth();
  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const isCurrentMonth = year===2026 && month===7;

  const eventMap = {
    19: [{label:"Sprint planning · 3:00 PM", color:"var(--accent)"}],
    20: [{label:"Authentication API deadline", color:"var(--danger)"}],
    21: [{label:"Dashboard UI deadline", color:"var(--warning)"}],
    23: [{label:"Design review", color:"var(--info)"}],
    25: [{label:"Testing deadline", color:"var(--warning)"}],
    27: [{label:"Documentation deadline", color:"var(--info)"}],
  };

  const cells = [];
  for (let i=0;i<firstDow;i++) cells.push(<div className="cal-cell pad" key={"p"+i}></div>);
  for (let d=1; d<=daysInMonth; d++){
    const isToday = isCurrentMonth && d===19;
    const isSelected = isCurrentMonth && d===selectedDay;
    const evts = isCurrentMonth ? (eventMap[d]||[]) : [];
    cells.push(
      <button key={d} className={"cal-cell " + (isToday?"today ":"") + (isSelected?"selected ":"")} onClick={()=>pickDay(d)}>
        {d}
        {evts.length>0 && <div className="cal-dots">{evts.map((e,i)=><span className="cal-dot" style={{background:isSelected?"#fff":e.color}} key={i}></span>)}</div>}
      </button>
    );
  }

  const selectedEvents = isCurrentMonth ? (eventMap[selectedDay]||[]) : [];

  return (
    <div>
      <div className="cal-head">
        <button className="cal-nav-btn" onClick={()=>shiftMonth(-1)}><IconChevronLeft size={14}/></button>
        <div className="cal-month">{monthLabel}</div>
        <button className="cal-nav-btn" onClick={()=>shiftMonth(1)}><IconChevronRight size={14}/></button>
      </div>
      <div className="cal-grid">
        {["S","M","T","W","T","F","S"].map((d,i)=><div className="cal-dow" key={i}>{d}</div>)}
        {cells}
      </div>
      <div className="cal-events">
        {selectedEvents.length>0 ? selectedEvents.map((e,i)=>(
          <div className="cal-event" key={i}><span className="dot" style={{background:e.color}}></span>{e.label}</div>
        )) : <div className="cal-empty">No events on this date.</div>}
      </div>
    </div>
  );
}

        <div className="modal-meta-item">
          <div className="modal-progress-label"><span>Update Progress</span><span>{task.progress}%</span></div>
          <input type="range" min="0" max="100" value={task.progress} onChange={(e)=>onProgress(task.id, parseInt(e.target.value))} />
        </div>

        <div className="modal-actions">
          <button className="btn" onClick={onClose}>Close</button>
          <button className="btn primary" onClick={()=>{ onStatus(task.id, "Completed"); onClose(); }}>Mark Complete</button>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
